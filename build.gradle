plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            programArguments.addAll('--username', 'bulefire_fox')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'org.ow2.asm:asm:9.9'
    implementation 'org.ow2.asm:asm-commons:9.9'
    implementation 'org.ow2.asm:asm-tree:9.9'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'org.jetbrains:annotations:24.0.1'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.20'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.20.1'
    implementation 'com.networknt:json-schema-validator:3.0.0'

    implementation('io.modelcontextprotocol.sdk:mcp:2.0.1') {
        exclude group: 'io.modelcontextprotocol.sdk', module: 'mcp-json-jackson3'
    }
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.1'

    implementation('com.volcengine:volcengine-java-sdk-ark-runtime:0.2.48') {
        exclude group: 'commons-lang', module: 'commons-lang'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    testImplementation platform('org.junit:junit-bom:6.1.0-M1')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0-M1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0-M1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.0-M1'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.26.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description       : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    archiveVersion.set("")
}

tasks.named('build').configure {
    dependsOn tasks.named('jar')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
